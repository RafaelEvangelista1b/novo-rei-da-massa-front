<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rei da Massa – Cozinha</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#f5efe6] text-[#3e2c23] font-sans">

<!-- HEADER -->
<header class="bg-white px-5 py-4 flex justify-between items-center shadow-md">
  <div class="flex items-center gap-2 font-bold text-lg">
    🥟 Rei da <span class="text-[#d35400]">Massa</span>
  </div>

  <div class="bg-red-100 text-red-500 px-3 py-1 rounded-full text-xs font-bold">
    ● Offline
  </div>
</header>

<!-- MAIN -->
<main class="p-6 max-w-3xl mx-auto">

  <!-- TOPO -->
  <div class="flex justify-between items-center mb-5">
    <h1 class="text-2xl font-bold">Pedidos da Cozinha</h1>
    <div class="bg-gray-500 text-white px-3 py-1 rounded-full text-sm">
      0 pedidos
    </div>
  </div>

  <!-- ESTADO VAZIO -->
  <div class="text-center mt-24 opacity-90">
    
    <!-- ÍCONE -->
    <div class="text-[90px] mb-5 drop-shadow-lg">
      🥟
    </div>

    <h2 class="text-lg font-bold mb-2">
      Nenhum pedido no momento
    </h2>

    <p class="text-gray-500">
      Os pedidos aparecerão aqui assim que forem feitos no sistema.
    </p>

    <button 
      onclick="simularPedidos()"
      class="mt-5 px-5 py-2 bg-[#d35400] text-white rounded-lg font-bold hover:bg-[#b84300] transition">
      Simular pedidos
    </button>

  </div>

</main>

<script>
  function simularPedidos() {
    alert("Aqui você vai conectar com seu sistema de pedidos depois 😉");
  }
</script>

</body>
</html>
